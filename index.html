<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUN星球 報價單產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --purple: #72469C;
    --blue: #60B7E6;
    --yellow: #FDCE73;
    --cream: #FFF7ED;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--cream);
    color: #3a2a52;
  }
  .app {
    display: flex;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    align-items: flex-start;
  }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(114,70,156,0.08);
  }
  .form-panel {
    width: 460px;
    flex-shrink: 0;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    position: sticky;
    top: 20px;
  }
  .preview-wrap {
    flex: 1;
    min-width: 0;
  }
  h1 {
    color: var(--purple);
    font-size: 18px;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #9a8ab8;
    margin-bottom: 16px;
  }
  h2.section-title {
    font-size: 13px;
    color: var(--purple);
    font-weight: 700;
    margin: 18px 0 8px;
    padding-top: 12px;
    border-top: 1px solid #f0e8f7;
  }
  h2.section-title:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--purple);
    margin: 8px 0 4px;
  }
  input[type="text"], input[type="number"], input[type="date"], textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #e6dcf2;
    border-radius: 8px;
    font-size: 13px;
    background: var(--cream);
    color: #3a2a52;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blue); }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  .client-type-toggle {
    display: flex;
    gap: 6px;
  }
  .client-type-toggle .opt {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border: 1.5px solid #e6dcf2;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--purple);
    cursor: pointer;
  }
  .client-type-toggle .opt.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .add-item-row { display: flex; gap: 6px; margin-top: 6px; }
  .add-item-row select { flex: 1; }
  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: var(--purple);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.secondary { background: var(--blue); }
  .btn.small { padding: 4px 8px; font-size: 11px; }
  .btn.danger { background: #d97a7a; }
  .item-card {
    border: 1.5px solid #e6dcf2;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    background: var(--cream);
  }
  .item-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .item-card-head .name { font-size: 13px; font-weight: 700; color: var(--purple); }
  .item-card-head .tax-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    background: #fff;
    color: #9a8ab8;
    border: 1px solid #e6dcf2;
  }
  .pdf-btn {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    border: none;
    border-radius: 10px;
    background: var(--yellow);
    color: #5a4210;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  /* ===== 報價單預覽（PDF 輸出範圍） ===== */
  #quote-doc {
    background: #fff;
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 44px;
    color: #2a2a2a;
    font-size: 13px;
    line-height: 1.6;
  }
  #quote-doc .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 3px solid var(--purple);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  #quote-doc .brand { font-size: 22px; font-weight: 800; color: var(--purple); }
  #quote-doc .brand-sub { font-size: 11px; color: #8a7aa8; margin-top: 2px; }
  #quote-doc .doc-title { font-size: 20px; font-weight: 800; color: #2a2a2a; text-align: right; }
  #quote-doc .doc-meta { font-size: 11px; color: #666; text-align: right; margin-top: 4px; }
  #quote-doc .client-block {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 18px;
    font-size: 12px;
  }
  #quote-doc .client-block .col { flex: 1; }
  #quote-doc .client-block .col-title { font-weight: 700; color: var(--purple); margin-bottom: 4px; }
  table.quote-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 11.5px;
  }
  table.quote-table th {
    background: var(--purple);
    color: #fff;
    padding: 8px 6px;
    text-align: center;
    font-weight: 700;
  }
  table.quote-table td {
    padding: 7px 6px;
    border-bottom: 1px solid #e6dcf2;
    vertical-align: top;
  }
  table.quote-table td.num { text-align: center; white-space: nowrap; }
  table.quote-table td.desc { font-size: 10.5px; color: #555; }
  table.quote-table tr.sum-row td { font-weight: 700; text-align: right; border-bottom: none; padding-top: 10px; }
  table.quote-table tr.sum-row.total td { font-size: 14px; color: var(--purple); }
  #quote-doc .notes {
    margin-top: 20px;
    font-size: 11px;
    color: #444;
  }
  #quote-doc .notes h3 {
    font-size: 12px;
    color: var(--purple);
    margin: 14px 0 6px;
  }
  #quote-doc .notes ol, #quote-doc .notes ul { margin: 0; padding-left: 18px; }
  #quote-doc .notes li { margin-bottom: 3px; }
  #quote-doc .sign-block {
    display: flex;
    justify-content: space-between;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed #ccc;
    font-size: 11px;
  }
  #quote-doc .sign-block .col { width: 47%; }
  #quote-doc .sign-line { margin-top: 24px; border-bottom: 1px solid #999; }

  @media print {
    body { background: #fff; }
    .form-panel, .pdf-btn { display: none; }
    .app { padding: 0; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="panel form-panel">
    <h1>💰 報價單產生器</h1>
    <div class="subtitle">選品項、填數量，右邊自動產出漂亮報價單</div>

    <h2 class="section-title">客戶資訊</h2>
    <label>客戶主類型（影響預設稅務顯示，個別品項仍依自身規則）</label>
    <div class="client-type-toggle">
      <div class="opt selected" data-type="B" onclick="setClientType('B')">企業／機構（稅外加）</div>
      <div class="opt" data-type="A" onclick="setClientType('A')">一般民眾（含稅）</div>
    </div>

    <label>單位／客戶名稱</label>
    <input type="text" id="client-name" placeholder="例：吉的堡教學中心" oninput="render()">

    <div class="row2">
      <div>
        <label>統一編號</label>
        <input type="text" id="client-tax-id" oninput="render()">
      </div>
      <div>
        <label>聯絡人</label>
        <input type="text" id="client-contact" oninput="render()">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>電話</label>
        <input type="text" id="client-phone" oninput="render()">
      </div>
      <div>
        <label>Email</label>
        <input type="text" id="client-email" oninput="render()">
      </div>
    </div>

    <h2 class="section-title">服務品項</h2>
    <div class="add-item-row">
      <select id="service-select"></select>
      <button class="btn" onclick="addItem()">+ 新增</button>
    </div>
    <div id="items-list"></div>

    <h2 class="section-title">交通出勤費</h2>
    <input type="text" id="transport-note" placeholder="例：另計 / 實報實銷 / 高雄市區免收" value="另計，不列入本報價" oninput="render()">

    <h2 class="section-title">活動資訊</h2>
    <textarea id="activity-info" placeholder="活動日期、地點、場次說明⋯（可多行）" oninput="render()"></textarea>

    <h2 class="section-title">報價單有效期</h2>
    <input type="text" id="validity" value="即日起 1 個月" oninput="render()">

    <h2 class="section-title">備註條款</h2>
    <textarea id="notes-text" style="min-height:160px;" oninput="render()"></textarea>

    <button class="pdf-btn" onclick="downloadPdf()">📄 下載 PDF</button>
  </div>

  <div class="preview-wrap">
    <div class="panel" style="padding:24px;">
      <div id="quote-doc"></div>
    </div>
  </div>

</div>

const TAX_RATE = 0.05;
let clientType = 'B';
let items = []; // {uid, serviceId, name, unit, price, qty, taxIncluded, desc}
let uidSeed = 1;

function initServiceSelect() {
  const sel = document.getElementById('service-select');
  let lastCat = '';
  SERVICES.forEach(s => {
    if (s.cat !== lastCat) {
      const og = document.createElement('optgroup');
      og.label = s.cat;
      og.id = 'og-' + s.cat;
      sel.appendChild(og);
      lastCat = s.cat;
    }
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name + (s.price ? `（$${s.price.toLocaleString()}/${s.unit}）` : `（${s.priceHint}）`);
    sel.lastChild.appendChild(opt);
  });
}

function setClientType(t) {
  clientType = t;
  document.querySelectorAll('.client-type-toggle .opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.type === t);
  });
  render();
}

function addItem() {
  const sel = document.getElementById('service-select');
  const svc = SERVICES.find(s => s.id === sel.value);
  if (!svc) return;
  items.push({
    uid: uidSeed++,
    name: svc.name,
    unit: svc.unit,
    price: svc.price || 0,
    qty: 1,
    taxIncluded: svc.taxIncluded,
    desc: svc.desc
  });
  renderItemsList();
  render();
}

function removeItem(uid) {
  items = items.filter(i => i.uid !== uid);
  renderItemsList();
  render();
}

function updateItem(uid, field, value) {
  const item = items.find(i => i.uid === uid);
  if (!item) return;
  if (field === 'price' || field === 'qty') {
    item[field] = parseFloat(value) || 0;
  } else {
    item[field] = value;
  }
  render();
}

function renderItemsList() {
  const list = document.getElementById('items-list');
  list.innerHTML = items.map(item => `
    <div class="item-card">

}

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('zh-Hant');
}

function downloadPdf() {
  const el = document.getElementById('quote-doc');
  const clientName = document.getElementById('client-name').value || '報價單';
  const today = new Date().toISOString().slice(0,10);

  // 截圖前把報價單暫時搬到畫面左上角 (0,0)，避免它原本排在左側表單右邊，
  // 導致 html2canvas 抓圖畫布寬度對不上實際偏移位置、把左半部裁掉的問題
  const originalParent = el.parentNode;
  const originalNextSibling = el.nextSibling;
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed; left:0; top:0; width:900px; margin:0; background:#fff; z-index:99999;';
  wrapper.appendChild(el);
  document.body.appendChild(wrapper);
  window.scrollTo(0, 0);

  function restoreDom() {
    originalParent.insertBefore(el, originalNextSibling);
    document.body.removeChild(wrapper);
  }

  html2pdf().set({
    margin: 0,
    filename: `FUN星球報價單_${clientName}_${today}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: el.scrollWidth, windowHeight: el.scrollHeight },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  }).from(el).save().then(restoreDom).catch(restoreDom);
}
