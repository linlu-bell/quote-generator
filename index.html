<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUN星球 報價單產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --purple: #72469C;
    --blue: #60B7E6;
    --yellow: #FDCE73;
    --cream: #FFF7ED;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--cream);
    color: #3a2a52;
  }
  .app {
    display: flex;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    align-items: flex-start;
  }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(114,70,156,0.08);
  }
  .form-panel {
    width: 460px;
    flex-shrink: 0;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    position: sticky;
    top: 20px;
  }
  .preview-wrap {
    flex: 1;
    min-width: 0;
  }
  h1 {
    color: var(--purple);
    font-size: 18px;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #9a8ab8;
    margin-bottom: 16px;
  }
  h2.section-title {
    font-size: 13px;
    color: var(--purple);
    font-weight: 700;
    margin: 18px 0 8px;
    padding-top: 12px;
    border-top: 1px solid #f0e8f7;
  }
  h2.section-title:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--purple);
    margin: 8px 0 4px;
  }
  input[type="text"], input[type="number"], input[type="date"], textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #e6dcf2;
    border-radius: 8px;
    font-size: 13px;
    background: var(--cream);
    color: #3a2a52;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blue); }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  .client-type-toggle {
    display: flex;
    gap: 6px;
  }
  .client-type-toggle .opt {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border: 1.5px solid #e6dcf2;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--purple);
    cursor: pointer;
  }
  .client-type-toggle .opt.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .add-item-row { display: flex; gap: 6px; margin-top: 6px; }
  .add-item-row select { flex: 1; }
  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: var(--purple);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.secondary { background: var(--blue); }
  .btn.small { padding: 4px 8px; font-size: 11px; }
  .btn.danger { background: #d97a7a; }
  .item-card {
    border: 1.5px solid #e6dcf2;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    background: var(--cream);
  }
  .item-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .item-card-head .name { font-size: 13px; font-weight: 700; color: var(--purple); }
  .item-card-head .tax-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    background: #fff;
    color: #9a8ab8;
    border: 1px solid #e6dcf2;
  }
  .pdf-btn {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    border: none;
    border-radius: 10px;
    background: var(--yellow);
    color: #5a4210;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  /* ===== 報價單預覽（PDF 輸出範圍） ===== */
  #quote-doc {
    background: #fff;
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 44px;
    color: #2a2a2a;
    font-size: 13px;
    line-height: 1.6;
    /* 不用 -apple-system/BlinkMacSystemFont：html2canvas 對這兩個蘋果系統字型的中文字距量測不準，
       某些字元組合（例如「動物」）截圖出來會疊字，換成微軟正黑體開頭就正常 */
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  #quote-doc .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 3px solid var(--purple);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  #quote-doc .brand-logo { height: 60px; display: block; }
  #quote-doc .brand-sub { font-size: 11px; color: #8a7aa8; margin-top: 2px; }
  #quote-doc .doc-title { font-size: 20px; font-weight: 800; color: #2a2a2a; text-align: right; }
  #quote-doc .doc-meta { font-size: 11px; color: #666; text-align: right; margin-top: 4px; }
  #quote-doc .client-block {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 18px;
    font-size: 12px;
  }
  #quote-doc .client-block .col { flex: 1; }
  #quote-doc .client-block .col-title { font-weight: 700; color: var(--purple); margin-bottom: 4px; }
  table.quote-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 11.5px;
  }
  table.quote-table th {
    background: var(--purple);
    color: #fff;
    padding: 8px 6px;
    text-align: center;
    font-weight: 700;
  }
  table.quote-table td {
    padding: 7px 6px;
    border-bottom: 1px solid #e6dcf2;
    vertical-align: top;
  }
  table.quote-table tr { page-break-inside: avoid; break-inside: avoid; }
  table.quote-table td.num { text-align: center; white-space: nowrap; }
  table.quote-table td.desc { font-size: 10.5px; color: #555; }
  table.quote-table tr.sum-row td { font-weight: 700; text-align: right; border-bottom: none; padding-top: 10px; }
  table.quote-table tr.sum-row.total td { font-size: 14px; color: var(--purple); }
  #quote-doc .notes {
    margin-top: 20px;
    font-size: 11px;
    color: #444;
  }
  #quote-doc .notes h3 {
    font-size: 12px;
    color: var(--purple);
    margin: 14px 0 6px;
    page-break-after: avoid;
    break-after: avoid;
  }
  #quote-doc .notes ol, #quote-doc .notes ul { margin: 0; padding-left: 18px; }
  #quote-doc .notes li { margin-bottom: 3px; page-break-inside: avoid; break-inside: avoid; }
  #quote-doc .sign-block {
    display: flex;
    justify-content: space-between;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed #ccc;
    font-size: 11px;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  #quote-doc .sign-block .col { width: 47%; }
  #quote-doc .sign-line { margin-top: 56px; border-bottom: 1px solid #999; }

  @media print {
    body { background: #fff; }
    .form-panel, .pdf-btn { display: none; }
    .app { padding: 0; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="panel form-panel">
    <h1>💰 報價單產生器</h1>
    <div class="subtitle">選品項、填數量，右邊自動產出漂亮報價單</div>

    <a href="https://docs.google.com/spreadsheets/d/1cA3tTVsxqpn_IifJwgfLlSQfcO5PR4xaHRMrRnCuC60/edit" target="_blank" rel="noopener" style="display:inline-block;margin-bottom:10px;font-size:12px;color:var(--blue);font-weight:700;text-decoration:none;">📋 查看所有已儲存的報價單 →</a>

    <h2 class="section-title">本張報價單聯絡人</h2>
    <label>FUN星球窗口（顯示於報價單上，Email／LINE 皆共用不變）</label>
    <select id="fun-contact" onchange="render()">
      <option value="0">劉珽愉（小魚姐姐）</option>
      <option value="1">盧佳伶（鈴噹姐姐）</option>
      <option value="2">黃筱娟（Lulu 姐姐）</option>
    </select>

    <h2 class="section-title">客戶資訊</h2>
    <label>客戶主類型（影響預設稅務顯示，個別品項仍依自身規則）</label>
    <div class="client-type-toggle">
      <div class="opt selected" data-type="B" onclick="setClientType('B')">企業／機構（稅外加）</div>
      <div class="opt" data-type="A" onclick="setClientType('A')">一般民眾（含稅）</div>
    </div>

    <label>單位／客戶名稱</label>
    <input type="text" id="client-name" placeholder="例：吉的堡教學中心" oninput="render()">

    <div class="row2">
      <div>
        <label>統一編號</label>
        <input type="text" id="client-tax-id" oninput="render()">
      </div>
      <div>
        <label>聯絡人</label>
        <input type="text" id="client-contact" oninput="render()">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>電話</label>
        <input type="text" id="client-phone" oninput="render()">
      </div>
      <div>
        <label>Email</label>
        <input type="text" id="client-email" oninput="render()">
      </div>
    </div>

    <h2 class="section-title">服務品項</h2>
    <div class="add-item-row">
      <select id="service-select"></select>
      <button class="btn" onclick="addItem()">+ 新增</button>
    </div>
    <div id="items-list"></div>

    <h2 class="section-title">交通出勤費</h2>
    <label>金額（高雄市區活動留空或填 0，這格就不會出現在報價單上；外縣市活動請填算好的來回總額）</label>
    <input type="number" id="transport-amount" placeholder="0" oninput="render()">
    <a href="https://linlu-bell.github.io/car-fare-calculator/" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:12px;color:var(--blue);font-weight:700;text-decoration:none;">🚗 開新視窗算車馬費 →</a>
    <label>說明（有填金額時才會顯示在報價單上，依實際交通方式調整）</label>
    <textarea id="transport-desc" style="min-height:70px;" oninput="render()">此項目為FUN星球專業說故事姐姐前往高雄市區以外辦理活動之通勤與等待之出勤費用。故事姐姐高鐵／台鐵往返活動場地之交通將由活動主辦方派員接送。如需故事姐姐自行前往，將依車資收據實報實銷。</textarea>

    <h2 class="section-title">活動資訊</h2>
    <textarea id="activity-info" placeholder="活動日期、地點、場次說明⋯（可多行）" oninput="render()"></textarea>

    <h2 class="section-title">報價單有效期</h2>
    <input type="text" id="validity" value="即日起 1 個月" oninput="render()">

    <h2 class="section-title">備註條款</h2>
    <textarea id="notes-text" style="min-height:160px;" oninput="render()"></textarea>

    <button class="pdf-btn" style="background:var(--blue);" onclick="saveQuote()">💾 儲存這張報價單</button>
    <div id="save-status" style="font-size:11px;color:#666;margin-top:6px;min-height:14px;"></div>

    <button class="pdf-btn" onclick="downloadPdf()">📄 下載 PDF</button>
  </div>

  <div class="preview-wrap">
    <div class="panel" style="padding:24px;">
      <div id="quote-doc"></div>
    </div>
  </div>

</div>

<script>
// ===== 服務品項資料（來源：FUN星球服務總覽.md，2026-04-23 版）=====
const SERVICES = [
  // B 企業與機構活動委辦
  { id:'B1', cat:'B 企業／機構活動委辦', name:'大型外場故事活動（60人以下）', unit:'場', price:6500, taxIncluded:false,
    desc:'✦ 此項目因有聚集人潮之效果，故事姐姐須使用擴音設備，主辦單位需自行負責場地申請及相關安排。\n✦ 建議年齡為三歲以上，三歲以下幼兒因專注力與理解力較不足，雖不強制限制，但如欲維持活動秩序，建議考慮年齡範圍。\n✦ 內容詳情介紹與注意事項：https://funplanet.tw/services/big_events/' },
  { id:'B1b', cat:'B 企業／機構活動委辦', name:'大型外場故事活動', unit:'場', price:8000, taxIncluded:false,
    desc:'✦ 此項目因有聚集人潮之效果，故事姐姐須使用擴音設備，主辦單位需自行負責場地申請及相關安排。\n✦ 建議年齡為三歲以上，三歲以下幼兒因專注力與理解力較不足，雖不強制限制，但如欲維持活動秩序，建議考慮年齡範圍。\n✦ 內容詳情介紹與注意事項：https://funplanet.tw/services/big_events/' },
  { id:'B2', cat:'B 企業／機構活動委辦', name:'到府故事活動（實體）', unit:'場', price:3000, taxIncluded:true,
    desc:'故事姐姐到指定室內場地講故事，60分鐘，最多12位小朋友，場地總人數不超過25人。若表演故事非FUN星球自有教案，需加收企劃編撰費。' },
  { id:'B3', cat:'B 企業／機構活動委辦', name:'線上故事活動（企業版）', unit:'場', price:10000, taxIncluded:false,
    desc:'30–40分鐘，人數不限，開放主辦方錄影存檔。' },
  { id:'B4', cat:'B 企業／機構活動委辦', name:'思辨星球', unit:'場', price:6000, taxIncluded:true,
    desc:'以故事為引導帶領孩子深度討論、思辨與表達，120分鐘，建議20人以內、國小二年級以上。若指定特定故事需加收企劃編撰費。' },
  { id:'B5', cat:'B 企業／機構活動委辦', name:'即興兒童故事劇場（商演，100人以下）', unit:'場', price:12000, taxIncluded:false,
    desc:'沒有劇本，演員用觀眾提供的點子即興演出，30分鐘、4位演出者、2–3個即興短劇。不含器材，主辦方需自備舞台音響。公家單位×1.5～2（上限$100,000）。' },
  { id:'B5b', cat:'B 企業／機構活動委辦', name:'即興兒童故事劇場（商演，200人以內）', unit:'場', price:18000, taxIncluded:false,
    desc:'沒有劇本，演員用觀眾提供的點子即興演出，30分鐘、4位演出者、2–3個即興短劇，適用200人以內場次。不含器材，主辦方需自備舞台音響。公家單位×1.5～2（上限$100,000）。' },
  { id:'B6', cat:'B 企業／機構活動委辦', name:'繪本演唱會（自有電子書版）', unit:'場', price:43000, taxIncluded:false,
    desc:'90分鐘，3位故事姐姐，每位參與兒童獲4本電子書QR Code，含社群宣傳貼文。不含音響燈光器材與交通費。' },
  { id:'B7', cat:'B 企業／機構活動委辦', name:'繪本演唱會（出版社合作版）', unit:'場', price:52000, taxIncluded:false,
    desc:'90分鐘，3位故事姐姐，每位參與兒童獲一本實體繪本，含社群宣傳貼文。不含音響燈光器材與交通費。' },
  // C 內容製作與企劃
  { id:'C1', cat:'C 內容製作與企劃', name:'市售繪本企劃編撰費', unit:'則', price:null, priceHint:'15,000–25,000', taxIncluded:false,
    desc:'根據客戶指定市售繪本，設計引發兒童思考與討論的實體活動教案（含活動簡報），交付文字腳本形式。不含出版社授權金。' },
  { id:'C2', cat:'C 內容製作與企劃', name:'原創故事編撰企劃費', unit:'則', price:null, priceHint:'35,000–50,000', taxIncluded:false,
    desc:'依客戶提供主題、元素創作一則適齡故事，交付故事文字大綱＋分鏡草圖。不含插圖繪製及道具製作。' },
  { id:'C3', cat:'C 內容製作與企劃', name:'故事插圖繪製', unit:'張', price:null, priceHint:'1,500–5,000', taxIncluded:false,
    desc:'專為兒童實體故事活動設計的原創插圖，根據主題及客戶指定元素創作。不含故事表演執行。' },
  { id:'C4', cat:'C 內容製作與企劃', name:'Podcast故事錄製與上架', unit:'則', price:20000, taxIncluded:false,
    desc:'將指定繪本錄製為Podcast節目於FUN星球故事頻道上架播出，廣告檔期結束後提供平台結案數據。' },
  { id:'C5', cat:'C 內容製作與企劃', name:'社群平台宣傳貼文', unit:'則', price:null, priceHint:'3,000–5,000', taxIncluded:false,
    desc:'活動相關圖文宣傳（素材需廠商提供，FUN星球微調文章風格）。若企劃與執行皆為FUN星球則贈送。' },
  { id:'C6', cat:'C 內容製作與企劃', name:'活動引導與主持（10分鐘起）', unit:'10分', price:null, priceHint:'依規模而定', taxIncluded:false,
    desc:'需搭配說故事活動，故事姐姐以熱情活潑態度為活動引導與主持。' },
  { id:'C7', cat:'C 內容製作與企劃', name:'延伸活動企劃', unit:'場', price:null, priceHint:'依討論而定', taxIncluded:false,
    desc:'依客戶訴求與場地性質企劃延伸活動（主題、內容設計、場地建議、時間表），需搭配說故事活動。' },
  // D 教學培訓
  { id:'D1', cat:'D 教學培訓', name:'說故事互動技巧實作坊', unit:'小時', price:null, priceHint:'依內容與規模議定時薪', taxIncluded:false,
    desc:'適合學校老師、才藝老師、幼教科系、家長、說故事志工。依內容目標與時數議定報價，車馬費另計。' },
  // E 教具製作
  { id:'E1', cat:'E 教具製作', name:'大型繪本教具（一般尺寸 90×60）', unit:'本', price:1800, taxIncluded:false,
    desc:'展開90×60cm，闔上45×60cm。基本單價含封面封底＋內頁2面，每增一面+350元。需簽署合作備忘錄後方能開始製作。' },
  { id:'E2', cat:'E 教具製作', name:'大型繪本教具（大型尺寸 120×90）', unit:'本', price:2200, taxIncluded:false,
    desc:'展開120×90cm，闔上60×60cm。基本單價含封面封底＋內頁2面，每增一面+550元。需簽署合作備忘錄後方能開始製作。' },
  // A 公開場活動（一般民眾，含稅）—— 幾乎不會用到，排在最後備用
  { id:'A1', cat:'A 公開場活動', name:'寶寶故事（單場）', unit:'人', price:300, taxIncluded:true,
    desc:'0～3歲認知主題親子互動故事，每位幼兒至少一位成人陪同，陪同家長免費。' },
  { id:'A2', cat:'A 公開場活動', name:'招牌故事（單場）', unit:'人', price:240, taxIncluded:true,
    desc:'1位專業故事姐姐＋大型繪本道具，2個互動故事，適合3歲以上，陪同家長免費。' },

function initServiceSelect() {
  const sel = document.getElementById('service-select');
  let lastCat = '';
  SERVICES.forEach(s => {
    if (s.cat !== lastCat) {
      const og = document.createElement('optgroup');
      og.label = s.cat;
      og.id = 'og-' + s.cat;
      sel.appendChild(og);
      lastCat = s.cat;
    }
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name + (s.price ? `（$${s.price.toLocaleString()}/${s.unit}）` : `（${s.priceHint}）`);
    sel.lastChild.appendChild(opt);
  });
}

function setClientType(t) {

  document.querySelectorAll('.client-type-toggle .opt').forEach(el => {

function addItem() {
  const sel = document.getElementById('service-select');
  const svc = SERVICES.find(s => s.id === sel.value);
  if (!svc) return;
  items.push({
    uid: uidSeed++,
    name: svc.name,
    unit: svc.unit,
    price: svc.price || 0,
    qty: 1,
    taxIncluded: svc.taxIncluded,
    desc: svc.desc
  });
  renderItemsList();
  render();
}

function removeItem(uid) {
  items = items.filter(i => i.uid !== uid);
  renderItemsList();
  render();
}

function updateItem(uid, field, value) {
  const item = items.find(i => i.uid === uid);
  if (!item) return;
  if (field === 'price' || field === 'qty') {
    item[field] = parseFloat(value) || 0;
  } else {
    item[field] = value;
  }
  render();
}

function renderItemsList() {
  const list = document.getElementById('items-list');
  list.innerHTML = items.map(item => `
    <div class="item-card">
      <div class="item-card-head">
        <span class="name">${item.name}</span>
        <span class="tax-badge">${item.taxIncluded ? '已含稅' : '稅外加'}</span>
      </div>
      <div class="row2">
        <div>
          <label>單價（${item.unit}）</label>
          <input type="number" value="${item.price}" oninput="updateItem(${item.uid},'price',this.value)">
        </div>
        <div>
          <label>數量</label>
          <input type="number" value="${item.qty}" oninput="updateItem(${item.uid},'qty',this.value)">
        </div>
      </div>
      <label>說明（可編輯，例如加註場次地點）</label>
      <textarea oninput="updateItem(${item.uid},'desc',this.value)">${item.desc}</textarea>
      <button class="btn danger small" style="margin-top:6px;" onclick="removeItem(${item.uid})">刪除此列</button>
    </div>
  `).join('');
}

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('zh-Hant');
}

function renderNotes(notes) {
  const lines = notes.split('\n').map(l => l.trim()).filter(l => l);
  const boundary = lines.findIndex(l => l.startsWith('【'));
  const numbered = boundary === -1 ? lines : lines.slice(0, boundary);
  const bulletBlock = boundary === -1 ? [] : lines.slice(boundary);
  let html = '';
  if (numbered.length) {
    html += `<ol>${numbered.map(l => `<li>${l.replace(/^\d+\.\s*/, '')}</li>`).join('')}</ol>`;
  }
  if (bulletBlock.length) {
    const [header, ...bullets] = bulletBlock;
    html += `<div style="font-weight:700;color:var(--purple);margin:10px 0 4px;">${header}</div>`;
    html += `<ul>${bullets.map(l => `<li>${l.replace(/^[・･]\s*/, '')}</li>`).join('')}</ul>`;
  }
  return html;
}

  document.getElementById('quote-doc').innerHTML = `
    <div class="doc-header">
      <div>

      </div>
      <div>
        <div class="doc-title">報價單</div>

    <div class="client-block">
      <div class="col">

      </div>
      <div class="col">

        聯絡人：${funContact.name}<br>
        電話：${funContact.phone}<br>
        Email：funstoryplanet@gmail.com<br>
        LINE 官方：@kaw6438x
      </div>
    </div>

    <table class="quote-table">
      <tr><th style="width:16%">品項</th><th style="width:8%">單位</th><th style="width:10%">單價</th><th style="width:7%">數量</th><th style="width:10%">小計</th><th>說明</th></tr>
      ${rows || transportRow ? '' : '<tr><td colspan="6" style="text-align:center;color:#aaa;padding:20px;">尚未選擇服務品項</td></tr>'}
      ${rows}${transportRow}
      <tr class="sum-row"><td colspan="6">未稅金額：${fmt(untaxedTotal)}　｜　營業稅（5%）：${fmt(taxAmount)}${includedTotal ? `　｜　已含稅品項：${fmt(includedTotal)}` : ''}</td></tr>
      <tr class="sum-row total"><td colspan="6">含稅總計：${fmt(grandTotal)}</td></tr>

    <div class="notes">
      <h3>活動資訊</h3>

function downloadPdf() {
  const el = document.getElementById('quote-doc');
  const clientName = document.getElementById('client-name').value || '報價單';
  const today = new Date().toISOString().slice(0,10);
  window.scrollTo(0, 0);

  // 不指定 windowWidth：html2pdf 內部本來就會把內容複製進一個跟 PDF 頁面等寬的容器再截圖，
  // 若我們另外指定跟這個內建寬度不同的 windowWidth，容器會在模擬視窗裡置中，導致左右被裁掉。
  html2pdf().set({
    margin: [12, 0, 14, 0],
    filename: `FUN星球報價單_${clientName}_${today}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.sign-block'] }
  }).from(el).save();
}

function getState() {
  return {
    clientType,
    items,
    funContact: document.getElementById('fun-contact').value,
    clientName: document.getElementById('client-name').value,
    clientTaxId: document.getElementById('client-tax-id').value,
    clientContact: document.getElementById('client-contact').value,
    clientPhone: document.getElementById('client-phone').value,
    clientEmail: document.getElementById('client-email').value,
    transportAmount: document.getElementById('transport-amount').value,
    transportDesc: document.getElementById('transport-desc').value,
    activityInfo: document.getElementById('activity-info').value,
    validity: document.getElementById('validity').value,
    notesText: document.getElementById('notes-text').value
  };
}

function applyState(state) {
  if (!state) return;
  clientType = state.clientType || 'B';
  document.querySelectorAll('.client-type-toggle .opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.type === clientType);
  });
  items = state.items || [];
  uidSeed = items.reduce((max, i) => Math.max(max, i.uid || 0), 0) + 1;
  document.getElementById('fun-contact').value = state.funContact || '0';
  document.getElementById('client-name').value = state.clientName || '';
  document.getElementById('client-tax-id').value = state.clientTaxId || '';
  document.getElementById('client-contact').value = state.clientContact || '';
  document.getElementById('client-phone').value = state.clientPhone || '';
  document.getElementById('client-email').value = state.clientEmail || '';
  document.getElementById('transport-amount').value = state.transportAmount || '';
  document.getElementById('transport-desc').value = state.transportDesc || '';
  document.getElementById('activity-info').value = state.activityInfo || '';
  document.getElementById('validity').value = state.validity || '即日起 1 個月';
  document.getElementById('notes-text').value = state.notesText || DEFAULT_NOTES;
  renderItemsList();
}

function buildEditLink() {
  const encoded = encodeURIComponent(JSON.stringify(getState()));
  const baseUrl = location.origin + location.pathname;
  return `${baseUrl}?uid=${quoteUid}&data=${encoded}`;
}

function saveQuote() {
  const statusEl = document.getElementById('save-status');
  if (!APPS_SCRIPT_LOG_URL) {
    statusEl.textContent = '尚未接上記錄表，這個功能還在設定中。';
    return;
  }
  const clientName = document.getElementById('client-name').value || '（未填客戶名稱）';
  const totalText = document.getElementById('quote-doc').querySelector('.sum-row.total');
  const totalDisplay = totalText ? totalText.textContent.replace('含稅總計：', '').trim() : '';
  const editLink = buildEditLink();

  navigator.clipboard && navigator.clipboard.writeText(editLink).catch(() => {});

  const logUrl = `${APPS_SCRIPT_LOG_URL}?doc=quote&uid=${encodeURIComponent(quoteUid)}&client=${encodeURIComponent(clientName)}&total=${encodeURIComponent(totalDisplay)}&link=${encodeURIComponent(editLink)}`;
  fetch(logUrl, { mode: 'no-cors' }).catch(() => {});

  statusEl.textContent = '已儲存！編輯連結已複製到剪貼簿，也記錄進「報價單記錄」表了。';
}

function loadFromUrl() {
  const params = new URLSearchParams(location.search);
  const uid = params.get('uid');
  const data = params.get('data');
  if (uid) quoteUid = uid;
  if (data) {
    try {
      applyState(JSON.parse(data));
      return true;
    } catch (e) {
      console.error('編輯連結資料解析失敗', e);
    }
  }
  return false;
}

document.getElementById('notes-text').value = DEFAULT_NOTES;
initServiceSelect();
loadFromUrl();
render();
